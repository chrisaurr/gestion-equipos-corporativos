# ============================================
# TEST DATABASE CONFIGURATION
# ============================================
# Usa base de datos de pruebas (puerto 5432, BD: inventario_test)
# Levantar con: docker-compose -f docker-compose.test.yml up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario_test
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA CONFIGURATION
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# FLYWAY CONFIGURATION
# ============================================
# Ejecuta migraciones automáticamente al iniciar tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gestion.equipos=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.cache=false

# ============================================
# TEST-SPECIFIC SETTINGS
# ============================================
spring.main.lazy-initialization=false
spring.jmx.enabled=false