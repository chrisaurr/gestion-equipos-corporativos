# ============================================
# E2E TESTING CONFIGURATION
# ============================================
# Este perfil se usa para correr la aplicación con la BD de pruebas
# para las pruebas de Selenium (E2E)
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=e2e

# PostgreSQL Test Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario_test
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.gestion.equipos=INFO